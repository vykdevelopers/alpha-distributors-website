{% extends "base.html" %}{% block title %}Product editor{% endblock %}{% block content %}<section class="login-area"><form method="post" enctype="multipart/form-data" class="formbox wide"><span class="eyebrow green">CATALOGUE MANAGEMENT</span><h1>{{ 'Edit product' if p else 'Add product' }}</h1><label>Product name<input name="name" required value="{{ p.name if p else '' }}"></label><label>Category<input name="category" required list="cats" value="{{ p.category if p else '' }}" placeholder="e.g. Farm Tools"><datalist id="cats"><option>Hand Tools</option><option>Power Tools</option><option>Construction Equipment</option><option>Farm Tools</option><option>Farm Equipment</option><option>Safety Equipment</option></datalist></label><label>Description<textarea name="description" rows="3">{{ p.description if p else '' }}</textarea></label><div class="two"><label>Price (KSh)<input type="number" min="0" step=".01" name="price" value="{{ p.price if p else 0 }}"></label><label>Stock quantity<input type="number" min="0" name="stock" value="{{ p.stock if p else 0 }}"></label></div><label>Upload product image (JPG, PNG, WEBP)<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"></label><label>Or image URL<input type="url" name="image_url" placeholder="https://..."></label><button class="button dark full">Save product</button><a href="{{ url_for('dashboard') }}">Cancel</a></form></section>{% endblock %}
